<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invitación - Ezra Cumple 3 Años</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #000000;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      width: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-container {
      width: 100%;
      max-width: 600px;
      background: #000000;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    /* Cada sección es un bloque independiente apilado */
    .section-card {
      width: 100%;
      position: relative;
      background-color: #000000;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
    }

    /* 1. Modo Normal: Las fotos completas (Portada, Ubicación, etc.) */
    .mode-normal img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 2. Modo Focal / Parallax Estilo Adobe Express */
    .mode-focal {
      height: 70vh; /* Altura de la ventana de revelado */
      overflow: hidden;
    }

    .mode-focal .focal-sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mode-focal img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(1.05);
      transition: transform 0.5s ease-out;
    }

    /* Botón flotante para la música */
    .audio-control-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99999;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #ddd;
      border-radius: 50px;
      padding: 12px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #222;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.2s ease;
    }

    .audio-control-btn:hover {
      transform: scale(1.05);
    }

    /* Enlace de WhatsApp estilo botón */
    .whatsapp-btn {
      display: block;
      width: 85%;
      margin: 40px auto 60px auto;
      padding: 18px;
      text-align: center;
      background-color: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
      font-size: 16px;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      position: relative;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- Imagen 1: Portada (Normal Completa) -->
    <div class="section-card mode-normal" style="z-index: 1;">
      <img src="imagen_ (1).jpg" alt="1">
    </div>

    <!-- Imagen 2: Efecto Focal / Ventana Reveladora Adobe -->
    <div class="section-card mode-focal" style="z-index: 2;">
      <div class="focal-sticky">
        <img src="imagen_ (2).jpg" alt="2">
      </div>
    </div>

    <!-- Imagen 3: Datos / Fecha (Normal Completa) -->
    <div class="section-card mode-normal" style="z-index: 3;">
      <img src="imagen_ (3).jpg" alt="3">
    </div>

    <!-- Imagen 4: Confirmación (Focal) -->
    <div class="section-card mode-focal" style="z-index: 4;">
      <div class="focal-sticky">
        <img src="imagen_ (4).jpg" alt="4">
      </div>
    </div>

    <!-- Imagen 5: Cartel Ezra 3 Años (Normal Completa) -->
    <div class="section-card mode-normal" style="z-index: 5;">
      <img src="imagen_ (5).jpg" alt="5">
    </div>

    <!-- Imagen 6: Bici Ezra (Focal) -->
    <div class="section-card mode-focal" style="z-index: 6;">
      <div class="focal-sticky">
        <img src="imagen_ (6).jpg" alt="6">
      </div>
    </div>

    <!-- Imagen 7: Papás / Padrinos (Normal Completa) -->
    <div class="section-card mode-normal" style="z-index: 7;">
      <img src="imagen_ (7).jpg" alt="7">
    </div>

    <!-- Imagen 8: Ubicación / Toro Loco (Normal Completa) -->
    <div class="section-card mode-normal" style="z-index: 8;">
      <img src="imagen_ (8).jpg" alt="8">
    </div>

    <!-- Botón WhatsApp -->
    <div class="section-card mode-normal" style="z-index: 9; background: #000;">
      <a class="whatsapp-btn" href="https://wa.me/524646462058?text=Confirmo%20mi%20asistencia" target="_blank" rel="noopener noreferrer">
        Confirmar asistencia por WhatsApp
      </a>
    </div>

  </div>

  <!-- Audio -->
  <audio id="bg-music" loop preload="auto">
    <source src="audio.mp3" type="audio/mpeg">
  </audio>

  <!-- Botón flotante -->
  <button id="music-toggle" class="audio-control-btn">
    <span id="music-icon">🎵</span>
    <span id="music-text">Pausar Música</span>
  </button>

  <script>
    const audio = document.getElementById('bg-music');
    const toggleBtn = document.getElementById('music-toggle');
    const musicIcon = document.getElementById('music-icon');
    const musicText = document.getElementById('music-text');

    let isPlaying = false;

    function playAudio() {
      if (!isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          musicIcon.textContent = '⏸️';
          musicText.textContent = 'Pausar Música';
        }).catch(() => {});
      }
    }

    function handleFirstUserInteraction() {
      playAudio();
      document.removeEventListener('click', handleFirstUserInteraction);
      document.removeEventListener('touchstart', handleFirstUserInteraction);
      document.removeEventListener('scroll', handleFirstUserInteraction);
    }

    document.addEventListener('click', handleFirstUserInteraction);
    document.addEventListener('touchstart', handleFirstUserInteraction);
    document.addEventListener('scroll', handleFirstUserInteraction);

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isPlaying) {
        audio.pause();
        musicIcon.textContent = '🎵';
        musicText.textContent = 'Reproducir Música';
        isPlaying = false;
      } else {
        playAudio();
      }
    });
  </script>
</body>
</html>
